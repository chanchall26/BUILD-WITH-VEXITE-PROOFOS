name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The suite covers everything a candidate could dispute: the deterministic
      # detectors, the derivation engine, calibration scoring, freshness decay,
      # and the credential. It needs no API key and makes no network calls.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
